<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin — CareerPilot AI</title>
<style>
:root{--bg:#070914;--card:#0d1120;--line:rgba(160,170,235,.16);--tx:#e7e9f6;--mu:#8b94b1;--a:#8b9bff;--b:#b79cff;--gold:#f2c46d;--red:#ff7a8a}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Inter','Segoe UI',system-ui,sans-serif;color:var(--tx);background:radial-gradient(900px 500px at 85% -10%,rgba(109,94,252,.22),transparent),radial-gradient(700px 400px at -10% 10%,rgba(242,196,109,.08),transparent),var(--bg);min-height:100vh;overflow-x:hidden}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 18px;background:rgba(10,13,28,.78);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:1.05rem;flex:1;min-width:150px}.top h1 span{color:var(--gold)}
.btn{min-height:40px;padding:8px 16px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--tx);font:inherit;font-size:.86rem;cursor:pointer}
.btn:hover{border-color:var(--a)}.btn.p{background:linear-gradient(135deg,var(--a),var(--b));color:#0b1024;border-color:transparent;font-weight:600}.btn.d{color:var(--red);border-color:rgba(255,122,138,.35);min-height:34px;padding:5px 11px}
.wrap{max-width:1250px;margin:0 auto;padding:22px 16px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
.st{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012));border:1px solid var(--line);border-top:1px solid rgba(242,196,109,.35);border-radius:16px;padding:16px}
.st b{display:block;font-size:1.9rem;color:var(--gold)}.st span{color:var(--mu);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:8px}.tabs .btn.on{background:linear-gradient(135deg,var(--a),var(--b));color:#0b1024;border-color:transparent;font-weight:600}
input[type=search]{flex:1;min-width:180px;min-height:40px;padding:8px 14px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:16px}
input:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px rgba(139,155,255,.22)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
table{width:100%;border-collapse:collapse}th,td{padding:12px 14px;text-align:left;vertical-align:top;font-size:.88rem;border-bottom:1px solid var(--line)}
th{color:var(--mu);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.025)}tr:last-child td{border-bottom:0}
td.n b{display:block;font-size:.95rem}td.n small{color:var(--mu);word-break:break-all}
.chip{display:inline-block;margin:2px 3px 2px 0;padding:2px 9px;border-radius:999px;background:rgba(139,155,255,.12);border:1px solid rgba(139,155,255,.28);font-size:.75rem}.chip.i{background:rgba(242,196,109,.1);border-color:rgba(242,196,109,.3)}
.mu{color:var(--mu)}.empty{padding:40px;text-align:center;color:var(--mu)}
@media(max-width:820px){thead{display:none}table,tbody,tr,td{display:block;width:100%}tr{padding:12px 14px;border-bottom:1px solid var(--line)}td{border:0;padding:4px 0}td[data-l]::before{content:attr(data-l)": ";color:var(--mu);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}td.n{padding-bottom:6px}}

.tabs.v{margin-left:auto}.btn.s{min-height:34px;padding:5px 11px}
.dr{position:fixed;inset:0;z-index:20;background:rgba(3,5,16,.65);backdrop-filter:blur(4px);display:none;justify-content:flex-end}.dr.on{display:flex}
.pn{width:min(760px,100%);height:100%;overflow-y:auto;background:var(--bg);border-left:1px solid var(--line);padding:18px 18px 60px}
.pn h2{margin:0 0 2px}.pn .hd{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 18px}
.sec{background:var(--card);border:1px solid var(--line);border-top:1px solid rgba(242,196,109,.3);border-radius:14px;padding:14px;margin-bottom:14px}.sec h3{margin:0 0 8px;font-size:.95rem;color:var(--gold)}
.ent{border-top:1px dashed var(--line);padding:10px 0}.ent:first-of-type{border-top:0}.ent time{color:var(--mu);font-size:.74rem}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:.86rem;margin-top:6px}.kv dt{color:var(--mu);text-transform:capitalize}.kv dd{margin:0;word-break:break-word}
.kv ul{margin:0;padding-left:18px}.pre{white-space:pre-wrap}
select{min-height:40px;padding:8px 12px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:inherit;font-size:14px}
.tg{font-size:.72rem;padding:2px 9px;border-radius:999px;background:rgba(242,196,109,.12);border:1px solid rgba(242,196,109,.35);color:var(--gold);white-space:nowrap}
@media(max-width:600px){.kv{grid-template-columns:1fr}.tabs.v{margin-left:0}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}.tw table{min-width:560px}.tw th{white-space:nowrap}.tw td{min-width:110px;max-width:340px;word-break:break-word}.tw td.pre{white-space:pre-wrap}
.me{display:flex;align-items:center;gap:9px;cursor:pointer}.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:#0b1024;background:linear-gradient(135deg,var(--a),var(--b))}
</style></head><body>
<div class="top"><h1>🛡️ CareerPilot <span>Admin</span></h1><span class="mu" id="src" style="font-size:.78rem"></span>
<div style="position:relative"><button class="btn" id="dl">⬇ Download ▾</button><div id="dlm" class="box" style="display:none;position:absolute;right:0;top:46px;min-width:250px;padding:6px;z-index:9"></div></div><button class="btn" id="ref">↻ Refresh</button><button class="btn me" id="me"><span class="av" id="mav">BK</span><span id="mnm">BHARATHRAJ K</span></button><button class="btn p" id="out">Log out</button></div>
<div class="wrap">
<div class="stats"><div class="st"><b id="s-all">0</b><span>Total users</span></div><div class="st"><b id="s-stu">0</b><span>Students</span></div><div class="st"><b id="s-grd">0</b><span>Graduates</span></div><div class="st"><b id="s-sk">0</b><span>Profiles with skills</span></div></div>
<div class="bar"><div class="tabs"><button class="btn on" data-t="students">🎓 Students</button><button class="btn" data-t="graduates">🚀 Graduates</button></div><div class="tabs v"><button class="btn on" data-v="users">👥 Users</button><button class="btn" data-v="act">🗂 All activity</button></div><select id="ft" style="display:none"><option value="">All features</option><option value="myPlan">My Plan</option><option value="careerMatch">Career Match</option><option value="roadmap">Roadmap</option><option value="resume">Resume</option><option value="interview">Interview</option><option value="coverLetter">Cover Letter</option></select><input type="search" id="q" placeholder="Search name, email, course, skill…"></div>
<div class="box" id="ubox"><table><thead><tr><th>Name</th><th>Course / Year</th><th>Skills</th><th>Interests</th><th>Joined</th><th>Last login</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="box" id="abox" style="display:none"><table><thead><tr><th>Name</th><th>Type</th><th>Feature</th><th>Summary</th><th>Date</th><th></th></tr></thead><tbody id="arows"></tbody></table></div>
</div>
<div class="dr" id="dr"><div class="pn" id="pn"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let adm=null;try{adm=JSON.parse(sessionStorage.getItem('cp_admin')||'null')}catch{}
if(!adm){location.replace('student.html')}
const base=location.protocol==='file:'?'http://localhost:5000':'';
const FEAT={myPlan:'My Plan',careerMatch:'Career Match',roadmap:'Roadmap',resume:'Resume Analysis',interview:'Interview Practice',coverLetter:'Cover Letter'};
let D={students:[],graduates:[]},tab='students',view='users';
const fmt=d=>d?new Date(d).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'—';
const typ=u=>u.role==='graduate'?'Graduate':'Student';
const allUsers=()=>[...D.students.map(u=>({...u,_t:'Student'})),...D.graduates.map(u=>({...u,_t:'Graduate'}))];
function localData(){let A={};try{A=JSON.parse(localStorage.getItem('cp_accounts')||'{}')}catch{}const all=Object.values(A).map(({h,salt,...u})=>u);
 const by=g=>all.filter(u=>g?u.role==='graduate':u.role!=='graduate').sort((a,b)=>String(a.name).localeCompare(String(b.name)));return{students:by(0),graduates:by(1)}}
async function load(){
 if(adm&&adm.token){try{const r=await fetch(base+'/api/admin/users',{headers:{Authorization:'Bearer '+adm.token}});
   if(r.status===401){sessionStorage.removeItem('cp_admin');location.replace('student.html');return}
   const j=await r.json();if(j.success){D=j;$('#src').textContent='● Live database';draw();return}}catch{}}
 D=localData();$('#src').textContent='● Demo mode (this browser only)';draw()}
const flat=o=>JSON.stringify(o).toLowerCase();
function summ(t,e){const j=a=>(a||[]).slice(0,4).join(', ');
 return {myPlan:()=>'Focus: '+(e.focusCareer||'—')+' · Top: '+j(e.topCareers),careerMatch:()=>(e.matches||[]).slice(0,3).map(m=>(m.career||m.title||m.name||'?')+' '+(m.match??'')+'%').join(', '),
 roadmap:()=>(e.targetCareer||'—')+' · '+(e.totalDuration||'')+' · '+(e.phases||[]).length+' phases',resume:()=>(e.targetCareer||'—')+' · readiness '+(e.readinessScore??'—')+'%',
 interview:()=>(e.role||'')+' · score '+(e.score??'—')+' · '+String(e.question||'').slice(0,70),coverLetter:()=>(e.role||'')+(e.company?' @ '+e.company:'')+' · '+String(e.letter||'').split(/\s+/).length+' words'}[t]();}
function entries(){const out=[];allUsers().forEach(u=>Object.entries(u.activity||{}).forEach(([t,l])=>(l||[]).forEach(e=>out.push({u,t,e}))));return out.sort((a,b)=>String(b.e.at).localeCompare(String(a.e.at)))}
function draw(){
 const all=allUsers(),ent=entries();
 $('#s-all').textContent=all.length;$('#s-stu').textContent=D.students.length;$('#s-grd').textContent=D.graduates.length;$('#s-sk').textContent=ent.length;
 document.querySelector('#s-sk').nextElementSibling.textContent='Saved activities';
 const q=$('#q').value.trim().toLowerCase();
 $('#ubox').style.display=view==='users'?'':'none';$('#abox').style.display=view==='act'?'':'none';$('.tabs:not(.v)').style.display=view==='users'?'':'none';$('#ft').style.display=view==='act'?'':'none';
 if(view==='users'){
  const list=(tab==='students'?D.students:D.graduates).filter(u=>!q||flat(u).includes(q));
  $('#rows').innerHTML=list.length?list.map(u=>{const n=Object.values(u.activity||{}).reduce((a,l)=>a+(l||[]).length,0);return `<tr><td class="n"><b>${esc(u.name)}</b><small>${esc(u.email)}</small></td>
  <td data-l="Course">${esc(u.course||'—')}<br><span class="mu">${esc(u.year||'')}</span></td>
  <td data-l="Skills">${(u.skills||[]).map(s=>`<span class="chip">${esc(s)}</span>`).join('')||'<span class="mu">—</span>'}</td>
  <td data-l="Interests">${(u.interests||[]).map(s=>`<span class="chip i">${esc(s)}</span>`).join('')||'<span class="mu">—</span>'}</td>
  <td data-l="Joined">${fmt(u.createdAt)}<br><span class="mu">${n} activities</span></td><td data-l="Last login">${fmt(u.lastLoginAt)}<br><span class="mu">${u.loginCount||0} logins</span></td>
  <td style="white-space:nowrap"><button class="btn s p" data-v="${esc(u.email)}">View all</button> <button class="btn d" data-e="${esc(u.email)}">Delete</button></td></tr>`}).join(''):`<tr><td colspan="7" class="empty">No ${tab} found.</td></tr>`;
 }else{
  const ft=$('#ft').value;
  const list=ent.filter(x=>(!ft||x.t===ft)&&(!q||flat({n:x.u.name,e:x.u.email,t:FEAT[x.t],d:x.e}).includes(q)));
  $('#arows').innerHTML=list.length?list.map((x,i)=>`<tr><td class="n"><b>${esc(x.u.name)}</b><small>${esc(x.u.email)}</small></td><td data-l="Type">${x.u._t}</td><td data-l="Feature"><span class="tg">${FEAT[x.t]}</span></td><td data-l="Summary">${esc(summ(x.t,x.e))}</td><td data-l="Date">${fmt(x.e.at)}</td><td><button class="btn s" data-v="${esc(x.u.email)}">Open</button></td></tr>`).join(''):`<tr><td colspan="6" class="empty">No saved activity yet.</td></tr>`}}
// ---- detail panel (table format)
const str=v=>v==null?'':Array.isArray(v)?(v.every(x=>x==null||typeof x!=='object')?v.join('; '):v.map(str).join(' | ')):typeof v==='object'?Object.entries(v).map(([k,x])=>k+': '+str(x)).join('; '):String(v);
const cols=l=>{const c=[];l.forEach(e=>Object.keys(e).forEach(k=>{if(k!=='at'&&!c.includes(k))c.push(k)}));return c};
const title=k=>k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase());
const rowsOf=l=>{const c=cols(l);return l.map(e=>Object.assign({Date:fmt(e.at)},...c.map(k=>({[title(k)]:str(e[k])}))))};
function tbl(l){if(!l.length)return '<span class="mu">No data yet.</span>';const c=cols(l);
 return `<div class="tw"><table><thead><tr><th>Date</th>${c.map(k=>`<th>${esc(title(k))}</th>`).join('')}</tr></thead><tbody>${[...l].reverse().map(e=>`<tr><td>${fmt(e.at)}</td>${c.map(k=>`<td class="${String(str(e[k])).length>120?'pre':''}">${esc(str(e[k]))||'<span class="mu">—</span>'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
const profRows=u=>[['Name',u.name],['Email',u.email],['Type',u._t||typ(u)],['Course',u.course],['Year',u.year],['Skills',(u.skills||[]).join(', ')],['Interests',(u.interests||[]).join(', ')],['Joined',fmt(u.createdAt)],['Last login',fmt(u.lastLoginAt)],['Total logins',u.loginCount||0]];
const byEmail=e=>allUsers().find(u=>u.email.toLowerCase()===String(e).toLowerCase());
function open_(email){const u=byEmail(email);if(!u)return;const act=u.activity||{};
 $('#pn').innerHTML=`<div style="display:flex;justify-content:space-between;gap:10px"><div><h2>${esc(u.name)}</h2><span class="mu">${esc(u.email)} · <span class="tg">${u._t}</span></span></div><button class="btn s" id="x">✕ Close</button></div>
 <div class="hd"><button class="btn s p" data-d="xlsx">⬇ Excel (.xlsx)</button><button class="btn s" data-d="csv">⬇ CSV</button><button class="btn s" data-d="json">⬇ JSON</button><button class="btn s" data-d="txt">⬇ Report</button><button class="btn s" data-d="print">🖨 Print / PDF</button></div>
 <div class="sec"><h3>👤 Profile</h3><div class="tw"><table><tbody>${profRows(u).map(([k,v])=>`<tr><th style="width:150px">${k}</th><td>${v===''||v==null?'<span class="mu">—</span>':esc(v)}</td></tr>`).join('')}</tbody></table></div></div>`+
 Object.keys(FEAT).map(t=>`<div class="sec"><h3>${{myPlan:'🧭',careerMatch:'🎯',roadmap:'🗺',resume:'📄',interview:'🎤',coverLetter:'✉️'}[t]} ${FEAT[t]} <span class="mu">(${(act[t]||[]).length})</span></h3>${tbl(act[t]||[])}</div>`).join('');
 $('#dr').classList.add('on');$('#pn').dataset.e=email;$('#x').onclick=()=>$('#dr').classList.remove('on')}
function openMe(){const m=(adm&&adm.user)||{name:'BHARATHRAJ K',email:'',role:'admin'};
 $('#pn').innerHTML=`<div style="display:flex;justify-content:space-between"><div><h2>${esc(m.name)}</h2><span class="tg">Administrator</span></div><button class="btn s" id="x">✕ Close</button></div><div class="sec" style="margin-top:16px"><h3>🛡️ Admin profile</h3><div class="tw"><table><tbody>${[['Name',m.name],['Email',m.email],['Role','Administrator'],['Data source',adm&&adm.token?'Live database':'Demo mode (this browser)'],['Students',D.students.length],['Graduates',D.graduates.length]].map(([k,v])=>`<tr><th style="width:150px">${k}</th><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div></div>`;
 $('#dr').classList.add('on');$('#pn').dataset.e='';$('#x').onclick=()=>$('#dr').classList.remove('on')}
$('#dr').onclick=e=>{if(e.target.id==='dr')$('#dr').classList.remove('on')};
// ---- downloads
const nameOf=n=>String(n).replace(/[\\/?*\[\]:]/g,' ').slice(0,31);
function loadXlsx(){return new Promise(r=>{if(window.XLSX)return r(true);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>r(!!window.XLSX);s.onerror=()=>r(false);document.head.appendChild(s)})}
async function xlsx(file,sheets){const ok=await loadXlsx();
 if(ok){const wb=XLSX.utils.book_new();sheets.forEach(([n,rows])=>{const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{Info:'No data'}]);const c=Object.keys(rows[0]||{Info:1});ws['!cols']=c.map(k=>({wch:Math.min(60,Math.max(k.length+2,...rows.slice(0,50).map(r=>String(r[k]||'').length+2)))}));XLSX.utils.book_append_sheet(wb,ws,nameOf(n))});XLSX.writeFile(wb,file+'.xlsx');return}
 // fallback: HTML tables that Excel opens
 const t=sheets.map(([n,rows])=>{const c=Object.keys(rows[0]||{Info:1});return '<h3>'+esc(n)+'</h3><table border="1"><tr>'+c.map(k=>'<th>'+esc(k)+'</th>').join('')+'</tr>'+(rows.length?rows:[{Info:'No data'}]).map(r=>'<tr>'+c.map(k=>'<td>'+esc(r[k])+'</td>').join('')+'</tr>').join('')+'</table><br>'}).join('');
 save(file+'.xls','<html><head><meta charset="utf-8"></head><body>'+t+'</body></html>','application/vnd.ms-excel')}
const userRows=l=>l.map(u=>({Type:u._t,Name:u.name,Email:u.email,Course:u.course||'',Year:u.year||'',Skills:(u.skills||[]).join('; '),Interests:(u.interests||[]).join('; '),Joined:fmt(u.createdAt),'Last login':fmt(u.lastLoginAt),Logins:u.loginCount||0}));
const actRows=l=>l.map(x=>({Type:x.u._t,Name:x.u.name,Email:x.u.email,Feature:FEAT[x.t],Date:fmt(x.e.at),Summary:summ(x.t,x.e),Details:str(Object.fromEntries(Object.entries(x.e).filter(([k])=>k!=='at')))}));
const save=(name,txt,mime)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:mime}));a.download=name;a.click()};
const cell=c=>'"'+String(c==null?'':typeof c==='object'?JSON.stringify(c):c).replace(/"/g,'""')+'"';
const csv=rows=>rows.map(r=>r.map(cell).join(',')).join('\n');
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const usersCsv=l=>csv([['Type','Name','Email','Course','Year','Skills','Interests','Joined','Last login','Logins','Activities']].concat(l.map(u=>[u._t,u.name,u.email,u.course,u.year,(u.skills||[]).join('; '),(u.interests||[]).join('; '),u.createdAt,u.lastLoginAt,u.loginCount||0,Object.values(u.activity||{}).reduce((a,x)=>a+(x||[]).length,0)])));
const actCsv=l=>csv([['Type','Name','Email','Feature','Date','Summary','Full details (JSON)']].concat(l.map(x=>[x.u._t,x.u.name,x.u.email,FEAT[x.t],x.e.at,summ(x.t,x.e),x.e])));
const txtOf=u=>{const L=['CAREERPILOT AI — USER REPORT','Name: '+u.name,'Email: '+u.email,'Type: '+u._t,'Course: '+(u.course||'-')+' '+(u.year||''),'Skills: '+(u.skills||[]).join(', '),'Interests: '+(u.interests||[]).join(', '),'Joined: '+fmt(u.createdAt),''];
 const w=(v,i)=>Array.isArray(v)?v.map(x=>typeof x==='object'?'\n'+w(x,i+1):i?'  '.repeat(i)+'- '+x:'- '+x).join('\n'):typeof v==='object'&&v?Object.entries(v).filter(([k])=>k!=='at').map(([k,x])=>'  '.repeat(i)+k+': '+(typeof x==='object'&&x?'\n'+w(x,i+1):x)).join('\n'):String(v);
 Object.keys(FEAT).forEach(t=>{L.push('=== '+FEAT[t].toUpperCase()+' ===');(u.activity||{})[t]?.length?u.activity[t].forEach(e=>{L.push('['+fmt(e.at)+']');L.push(w(e,1));L.push('')}):L.push('(no data)','')});return L.join('\n')};
$('#pn').onclick=e=>{const k=e.target.dataset&&e.target.dataset.d;if(!k)return;const u=byEmail($('#pn').dataset.e),n=slug(u.name);
 if(k==='xlsx')xlsx(n,[['Profile',profRows(u).map(([a,b])=>({Field:a,Value:str(b)}))]].concat(Object.keys(FEAT).map(t=>[FEAT[t],rowsOf((u.activity||{})[t]||[])])));
 if(k==='json')save(n+'.json',JSON.stringify(u,null,2),'application/json');
 if(k==='csv'){const l=Object.entries(u.activity||{}).flatMap(([t,a])=>a.map(e=>({u,t,e})));save(n+'.csv',actCsv(l),'text/csv')}
 if(k==='txt')save(n+'-report.txt',txtOf(u),'text/plain');
 if(k==='print'){const w=window.open('','_blank');if(w){w.document.write('<pre style="font:13px/1.5 system-ui;white-space:pre-wrap;padding:24px">'+esc(txtOf(u))+'</pre>');w.document.close();w.print()}}};
