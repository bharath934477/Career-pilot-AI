<!DOCTYPE html>
<html lang="en"><head><script src="guard.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Cover Letter Generator</title>
<style>
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;color:#e7e9f6;background:#070914;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 120px}
h1{text-align:center;color:#8b9bff;text-shadow:0 0 18px rgba(139,155,255,.45)}.sub{text-align:center;color:#8b94b1;margin:-8px 0 22px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:800px){.cols{grid-template-columns:1fr}}
label{display:block;margin:12px 0 5px;font-size:.85rem;color:#b79cff}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1.5px solid rgba(160,168,235,.3);background:rgba(0,0,0,.25);color:#e7e9f6;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:#b79cff;box-shadow:0 0 14px rgba(160,168,235,.5)}select option{background:#0d1120}
.paper{background:#f7f9fb;color:#1b2430;border-radius:10px;padding:26px;min-height:320px;white-space:pre-wrap;line-height:1.6;font-family:Georgia,serif;font-size:.95rem;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.paper.empty{color:#8a97a6;display:flex;align-items:center;justify-content:center;text-align:center;font-family:'Segoe UI',sans-serif}
.acts{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.meta{color:#8b94b1;font-size:.8rem;margin-top:8px}
</style></head><body>
<div class="wrap">
  <h1>✉️ AI Cover Letter Generator</h1><p class="sub">Tailored, professional letters in seconds.</p>
  <div class="cols">
    <div class="pro-card">
      <label>Your name</label><input id="name" placeholder="Jane Doe">
      <label>Role you're applying for</label><input id="role" placeholder="Junior Data Analyst">
      <label>Company</label><input id="company" placeholder="Acme Corp">
      <label>Key skills</label><input id="skills" placeholder="Python, SQL, Tableau">
      <label>Tone</label><select id="tone"><option>professional</option><option>enthusiastic</option><option>confident</option><option>concise</option></select>
      <label>Job description (optional)</label><textarea id="jd" rows="4" placeholder="Paste the job posting to tailor the letter…"></textarea>
      <button class="pro-btn" id="gen" style="width:100%;margin-top:16px">Generate letter ✨</button>
    </div>
    <div>
      <div class="paper empty" id="paper">Your letter will appear here.</div>
      <div class="meta" id="meta"></div>
      <div class="acts"><button class="pro-btn ghost" id="copy">📋 Copy</button><button class="pro-btn ghost" id="dl">⬇️ Download .txt</button><button class="pro-btn ghost" id="regen">🔁 Regenerate</button></div>
    </div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
$('skills').value=localStorage.getItem('skills')||'';
function localLetter(d){const sk=(d.skills||'').split(',').map(s=>s.trim()).filter(Boolean),top=sk.slice(0,3).join(', ')||'relevant skills';
 const open={enthusiastic:'I was thrilled to see',confident:'I am the right candidate for',concise:'I am applying for',professional:'I am writing to apply for'}[d.tone]||'I am writing to apply for';
 return `Dear Hiring Manager,\n\n${open} the ${d.role} position at ${d.company||'your company'}. With hands-on experience in ${top}, I am confident I can contribute quickly and grow with your team.\n\nIn my recent work I have built projects that turned ideas into measurable results, collaborated across teams, and learned new tools fast. ${d.jobDescription?'Your job description emphasises skills that closely match my background, and I would bring that same focus to this role.':'I am especially drawn to this role because it combines learning with real impact.'}\n\nI would welcome the chance to discuss how I can help ${d.company||'your team'} succeed. Thank you for your time and consideration.\n\nSincerely,\n${d.name||'Your Name'}`}
async function gen(){
  const d={name:$('name').value,role:$('role').value.trim(),company:$('company').value,skills:$('skills').value,tone:$('tone').value,jobDescription:$('jd').value};
  if(!d.role){proToast('Enter the role first');return}
  $('gen').disabled=true;$('gen').textContent='Writing…';const p=$('paper');p.className='paper';p.textContent='';
  let txt,src='AI';try{const r=await proPost('/api/cover-letter',d);if(!r.success)throw 0;txt=r.letter}catch{txt=localLetter(d);src='offline template'}
  if(window.cpLog)cpLog('coverLetter',{name:d.name,role:d.role,company:d.company,skills:d.skills,tone:d.tone,source:src,letter:txt});
  let i=0;(function type(){p.textContent=txt.slice(0,i);i+=4;if(i<=txt.length+3)setTimeout(type,12);else{$('gen').disabled=false;$('gen').textContent='Generate letter ✨'}})();
  $('meta').textContent=`Generated by ${src} · ${txt.split(/\s+/).length} words`;
}
$('gen').onclick=gen;$('regen').onclick=gen;
const cur=()=>$('paper').classList.contains('empty')?'':$('paper').textContent;
$('copy').onclick=async()=>{if(!cur())return;await navigator.clipboard.writeText(cur());proToast('Copied to clipboard')};
$('dl').onclick=()=>{if(!cur())return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([cur()],{type:'text/plain'}));a.download='cover-letter.txt';a.click()};
</script>
<script src="pro.js"></script><script src="ai-chatbot.js"></script>
</body></html>
