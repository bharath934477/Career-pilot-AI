<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Career Suggestions — Hacker Mode</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg-color: #0a0f14;
      --panel-color: #101820e0;
      --neon-blue: #00bfff;
      --neon-green: #00ff9c;
      --muted: #555a65;
      --text-color: #c7f0f9;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 80px 16px;
      color: var(--text-color);
      background: var(--bg-color);
      overflow: hidden;
    }

    canvas#matrixCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: radial-gradient(circle at 15% 15%, rgba(0,191,255,0.08), transparent 15%),
                  linear-gradient(180deg, #061016 0%, var(--bg-color) 50%, #03101a 100%);
    }

    h1 {
      color: var(--neon-blue);
      text-shadow: 0 0 6px var(--neon-blue), 0 0 20px var(--neon-blue);
      margin-bottom: 20px;
      animation: flicker 3s infinite alternate;
      z-index: 2;
      position: relative;
    }

    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
      20%, 22%, 24%, 55% { opacity: 0.6; }
    }

    .terminal {
      background: var(--panel-color);
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,191,255,0.4);
      border: 1px solid rgba(0,191,255,0.2);
      padding: 30px;
      width: min(90%, 600px);
      min-height: 300px;
      font-size: 1rem;
      overflow-y: auto;
      position: relative;
      z-index: 2;
    }

    .line {
      margin-bottom: 10px;
      white-space: pre-wrap;
    }

    .green { color: var(--neon-green); }
    .blue { color: var(--neon-blue); }

    button {
      margin-top: 30px;
      background: var(--neon-green);
      color: #001b29;
      border: none;
      padding: 14px 22px;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 20px var(--neon-green);
      transition: all 0.3s ease;
      position: relative;
      z-index: 2;
    }

    button:hover {
      background: var(--neon-blue);
      box-shadow: 0 0 30px var(--neon-blue);
      color: #001b29;
    }
  </style>
</head>
<body>
  <canvas id="matrixCanvas"></canvas>
  <h1>🧠 Career Intelligence Terminal</h1>
  <div class="terminal" id="terminal"></div>
  <button onclick="restart()">← Back to Input</button>

  <script>
    // === MATRIX BACKGROUND EFFECT ===
    const canvas = document.getElementById('matrixCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const chars = '01ZXCVBNMASDFGHJKLQWERTYUIOP@#$%&*';
    const fontSize = 16;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff9c';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(drawMatrix, 50);
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    // === TERMINAL LOGIC ===
    const terminal = document.getElementById('terminal');

    function printLine(text, color = '') {
      const line = document.createElement('div');
      line.className = 'line ' + color;
      line.textContent = text;
      terminal.appendChild(line);
      terminal.scrollTop = terminal.scrollHeight;
    }

    function typeLine(text, color = '', delay = 30) {
      return new Promise(resolve => {
        const line = document.createElement('div');
        line.className = 'line ' + color;
        terminal.appendChild(line);
        let i = 0;
        const typer = setInterval(() => {
          line.textContent = text.slice(0, i++);
          terminal.scrollTop = terminal.scrollHeight;
          if (i > text.length) {
            clearInterval(typer);
            resolve();
          }
        }, delay);
      });
    }

    function restart() {
      localStorage.clear();
      window.location.href = 'index.html';
    }

    async function main() {
      const skills = localStorage.getItem('skills');
      const interests = localStorage.getItem('interests');

      if (!skills || !interests) {
        printLine('⚠️ Data not found. Redirecting...', 'green');
        setTimeout(() => window.location.href = 'index.html', 1500);
        return;
      }

      const skillList = skills.split(',').map(s => s.trim());
      const interestList = interests.split(',').map(i => i.trim());

      await typeLine('> Initializing career intelligence engine...', 'blue', 40);
      await typeLine('> Skills detected: ' + skillList.join(', '), 'green', 25);
      await typeLine('> Interests detected: ' + interestList.join(', '), 'green', 25);
      await typeLine('> Processing data through AI neurons...', 'blue', 40);

      const suggestions = generateSuggestions(skillList, interestList);
      await typeLine('> Potential career paths identified:\n', 'green', 25);

      for (const s of suggestions) {
        await typeLine('   • ' + s, 'blue', 25);
      }

      await typeLine('\n> Operation complete. System ready for deployment 🚀', 'green', 35);
    }

    function generateSuggestions(skills, interests) {
      const all = [
        { match: ['python', 'ai', 'ml'], career: 'Machine Learning Engineer' },
        { match: ['javascript', 'web'], career: 'Full Stack Developer' },
        { match: ['network', 'security', 'linux'], career: 'Cybersecurity Analyst' },
        { match: ['design', 'ui', 'ux'], career: 'UI/UX Designer' },
        { match: ['data', 'analytics', 'sql'], career: 'Data Scientist' },
        { match: ['cloud', 'aws', 'azure'], career: 'Cloud Solutions Architect' },
        { match: ['robotics', 'automation'], career: 'Robotics Engineer' },
        { match: ['writing', 'communication'], career: 'Technical Writer' },
        { match: ['gaming', '3d', 'graphics'], career: 'Game Developer' },
      ];

      const lowerSkills = skills.map(s => s.toLowerCase());
      const lowerInterests = interests.map(i => i.toLowerCase());

      const matched = all.filter(({ match }) =>
        match.some(word => lowerSkills.includes(word) || lowerInterests.includes(word))
      );

      return matched.length
        ? matched.map(m => m.career)
        : ['Software Developer', 'System Administrator', 'IT Consultant'];
    }

    main();
  </script>
</body>
</html>
