<!DOCTYPE html>
<html lang="en"><head><script src="guard.js"></script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Career Match</title>
<style>
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;color:#e7e9f6;background:#070914;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 120px}
h1{text-align:center;color:#8b9bff;text-shadow:0 0 18px rgba(139,155,255,.45)}.sub{text-align:center;color:#8b94b1;margin:-8px 0 22px}
label{display:block;margin:12px 0 5px;font-size:.85rem;color:#b79cff}
input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1.5px solid rgba(160,168,235,.3);background:rgba(0,0,0,.25);color:#e7e9f6;font:inherit;outline:none}
input:focus{border-color:#b79cff;box-shadow:0 0 14px rgba(160,168,235,.5)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.row{grid-template-columns:1fr}}
.cols{display:grid;grid-template-columns:340px 1fr;gap:18px;margin-top:18px}@media(max-width:820px){.cols{grid-template-columns:1fr}}
.m{margin-bottom:14px}.m .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.m h4{margin:0}.m .pct{color:#8b9bff;font-weight:800;font-size:1.2rem}
.m i{display:block;height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0}
.m i b{display:block;height:100%;width:0;background:linear-gradient(90deg,#8b9bff,#b79cff,#6d5efc);border-radius:6px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.m p{margin:4px 0;color:#a4acc6;font-size:.85rem}.tags span{display:inline-block;margin-right:6px;padding:2px 9px;border-radius:999px;font-size:.72rem;border:1px solid rgba(160,168,235,.35);background:rgba(160,168,235,.1)}
.tags .High{border-color:rgba(139,155,255,.5);color:#8b9bff}.tags .Low{border-color:rgba(255,159,67,.5);color:#f2c46d}
svg text{fill:#a4acc6;font-size:11px;font-family:'Segoe UI',sans-serif}
#status{text-align:center;color:#8b9bff;min-height:22px;margin-top:10px}.hidden{display:none}
.chip{display:inline-block;margin:3px;padding:4px 10px;border-radius:999px;background:rgba(139,155,255,.12);border:1px solid rgba(139,155,255,.3);font-size:.8rem}
</style></head><body>
<div class="wrap">
  <h1>🎯 AI Career Match</h1><p class="sub">Your strengths radar and ranked best-fit careers.</p>
  <div class="pro-card">
    <div class="row"><div><label>Skills (comma separated)</label><input id="skills" placeholder="Python, Design, SQL"></div>
    <div><label>Interests</label><input id="interests" placeholder="AI, Web, Data"></div></div>
    <button class="pro-btn" id="go" style="width:100%;margin-top:16px">Analyze my career fit →</button><div id="status"></div>
  </div>
  <div id="out" class="hidden">
    <div class="cols">
      <div class="pro-card"><h3 style="margin-top:0">Strength radar</h3><div id="radar"></div><div id="strengths"></div></div>
      <div class="pro-card"><h3 style="margin-top:0">Top matches</h3><div id="matches"></div></div>
    </div>
    <p style="text-align:center;margin-top:20px"><a class="pro-btn" href="roadmap.html">Build a roadmap for my top match →</a></p>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
$('skills').value=localStorage.getItem('skills')||'';$('interests').value=localStorage.getItem('interests')||'';
const CAR={
 'Full Stack Developer':{k:['javascript','react','node','html','css','git','web'],t:[85,60,70,40,45],sal:'₹6–25 LPA',d:'High'},
 'Data Analyst':{k:['sql','excel','python','tableau','statistics','data','power bi'],t:[65,40,90,50,40],sal:'₹5–18 LPA',d:'High'},
 'Machine Learning Engineer':{k:['python','tensorflow','pytorch','ai','ml','statistics','pandas'],t:[92,45,90,35,40],sal:'₹8–35 LPA',d:'High'},
 'UI/UX Designer':{k:['figma','design','prototyping','research','creative','ux'],t:[45,95,60,70,45],sal:'₹4–20 LPA',d:'Medium'},
 'Cybersecurity Analyst':{k:['security','networking','linux','firewall','penetration','hacking'],t:[85,35,80,40,45],sal:'₹5–22 LPA',d:'High'},
 'Product Manager':{k:['product','communication','leadership','strategy','analytics','management'],t:[55,60,75,90,90],sal:'₹10–40 LPA',d:'High'},
 'Cloud / DevOps Engineer':{k:['aws','docker','kubernetes','linux','cloud','devops','git'],t:[90,30,70,45,50],sal:'₹6–28 LPA',d:'High'}};
function local(sk,it){const words=(sk+','+it).toLowerCase().split(/[,\s]+/).filter(Boolean);
 const m=Object.entries(CAR).map(([career,c])=>{const hits=c.k.filter(k=>words.some(w=>w.includes(k)||k.includes(w))).length;
  return{career,match:Math.min(96,28+Math.round(hits/c.k.length*68)+(hits?6:0)),salaryRange:c.sal,demand:c.d,why:hits?`Matches ${hits} of your skills/interests.`:'Adjacent path — worth exploring.',t:c.t}}).sort((a,b)=>b.match-a.match).slice(0,6);
 const t=m[0].t;return{matches:m,strengths:words.slice(0,5),traits:{technical:t[0],creative:t[1],analytical:t[2],social:t[3],leadership:t[4]}}}
function radar(tr){const keys=Object.keys(tr),n=keys.length,cx=150,cy=140,R=95;
 const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};
 let g='';[25,50,75,100].forEach(l=>g+=`<polygon points="${keys.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="rgba(160,168,235,.2)"/>`);
 keys.forEach((k,i)=>{const[x,y]=pt(i,100),[lx,ly]=pt(i,122);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(160,168,235,.2)"/><text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle">${k[0].toUpperCase()+k.slice(1)}</text>`});
 const poly=keys.map((k,i)=>pt(i,tr[k]).join(',')).join(' ');
 $('radar').innerHTML=`<svg viewBox="0 0 300 280" width="100%"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b9bff"/><stop offset="1" stop-color="#6d5efc"/></linearGradient></defs>${g}
 <polygon id="rp" points="${keys.map(()=>cx+','+cy).join(' ')}" fill="url(#rg)" fill-opacity=".35" stroke="#8b9bff" stroke-width="2"/></svg>`;
 const el=$('rp'),from=keys.map(()=>[cx,cy]),to=keys.map((k,i)=>pt(i,tr[k])),s=performance.now();
 (function f(now){const k=Math.min(1,(now-s)/900),e=1-Math.pow(1-k,3);
  el.setAttribute('points',to.map((p,i)=>[cx+(p[0]-cx)*e,cy+(p[1]-cy)*e].join(',')).join(' '));if(k<1)requestAnimationFrame(f)})(s)}
function render(d){radar(d.traits||{});
 $('strengths').innerHTML=(d.strengths||[]).map(s=>`<span class="chip">${proEsc(s)}</span>`).join('');
 $('matches').innerHTML=d.matches.map(m=>`<div class="m"><div class="top"><h4>${proEsc(m.career)}</h4><span class="pct" data-v="${m.match}">0%</span></div>
  <i><b data-w="${m.match}"></b></i><div class="tags"><span>${proEsc(m.salaryRange)}</span><span class="${proEsc(m.demand)}">${proEsc(m.demand)} demand</span></div><p>${proEsc(m.why)}</p></div>`).join('');
 $('out').classList.remove('hidden');
 requestAnimationFrame(()=>{document.querySelectorAll('.m i b').forEach(b=>b.style.width=b.dataset.w+'%');document.querySelectorAll('.pct').forEach(p=>proCount(p,+p.dataset.v,1100,'%'))});
 localStorage.setItem('topCareer',d.matches[0].career)}
$('go').onclick=async()=>{const skills=$('skills').value.trim(),interests=$('interests').value.trim();
 if(!skills){proToast('Enter at least one skill');return}
 localStorage.setItem('skills',skills);localStorage.setItem('interests',interests);
 $('go').disabled=true;$('status').textContent='🧠 Matching you against career profiles…';let d;
 try{d=await proPost('/api/career-match',{skills,interests});if(!d.success||!d.matches)throw 0;d.matches.sort((a,b)=>b.match-a.match)}catch{d=local(skills,interests);$('status').textContent='AI offline — showing local estimate';setTimeout(()=>$('status').textContent='',3500)}
 if($('status').textContent.startsWith('🧠'))$('status').textContent='';$('go').disabled=false;if(window.cpLog)cpLog('careerMatch',{skills,interests,matches:(d.matches||[]).slice(0,6)});render(d);$('out').scrollIntoView({behavior:'smooth'})};
</script>
<script src="pro.js"></script><script src="ai-chatbot.js"></script>
</body></html>
